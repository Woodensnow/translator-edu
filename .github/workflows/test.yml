name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: pip install -r services/asr/requirements-ci.txt

      - name: Python tests
        run: python -m pytest

      - name: Web tests
        run: node --test apps/web/tests/*.test.js
